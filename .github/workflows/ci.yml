name: CI demo

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v7

      - name: Pythonを準備
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: テストを実行
        run: python -m unittest -v